<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;width:1000px;height:420px;font:14px system-ui;display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;flex-direction:column;justify-content:center;gap:22px;padding:30px}
.light{background:#dfe3e8;color:#222}.dark{background:#202124;color:#ddd}
.tab{display:flex;align-items:center;gap:8px;width:260px;padding:8px 12px;border-radius:8px 8px 0 0;font-size:13px}
.light .tab{background:#fff}.dark .tab{background:#35363a}
.tab img{width:16px;height:16px;image-rendering:auto}
.row{display:flex;gap:18px;align-items:center}
.big img{width:64px;height:64px}
</style></head><body>
<div class="half light"><div class="tab"><img src="../favicon.svg">One Item, Two Bins · Team 11</div>
  <div class="row big"><img src="../favicon.svg"><span>16 px tab (above) · 64 px</span></div></div>
<div class="half dark"><div class="tab"><img src="../favicon.svg">One Item, Two Bins · Team 11</div>
  <div class="row big"><img src="../favicon.svg"><span>Chrome dark theme</span></div></div>
</body></html>
